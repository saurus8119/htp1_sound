name: Build HTP-1 Inspector addon

on:
  pull_request:
    paths:
      - 'addons/htp1-inspector/**'
      - 'tools/pack.sh'
      - '.github/workflows/build-htp1-inspector.yml'
  push:
    branches: [main, master]
    paths:
      - 'addons/htp1-inspector/**'
      - 'tools/pack.sh'
      - '.github/workflows/build-htp1-inspector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and Python syntax
        run: |
          set -euo pipefail
          jq -e '.id == "htp1-inspector" and .ui.page == "/addons/htp1-inspector/" and .units["htp1-inspector.service"] == "enable"' addons/htp1-inspector/addon.json
          python3 -m py_compile addons/htp1-inspector/bin/htp1-inspector.py
          bash -n tools/pack.sh
      - name: Build installable addon archive
        id: package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package"
          ARCHIVE="$(bash tools/pack.sh addons/htp1-inspector htp1-inspector "$RUNNER_TEMP/package")"
          test -s "$ARCHIVE"
          tar -tzf "$ARCHIVE" | tee "$RUNNER_TEMP/archive-list.txt"
          grep -Fxq 'htp1-inspector/addon.json' "$RUNNER_TEMP/archive-list.txt"
          grep -Fxq 'htp1-inspector/bin/htp1-inspector.py' "$RUNNER_TEMP/archive-list.txt"
          grep -Fxq 'htp1-inspector/units/htp1-inspector.service' "$RUNNER_TEMP/archive-list.txt"
          grep -Fxq 'htp1-inspector/www/index.html' "$RUNNER_TEMP/archive-list.txt"
          tar -xOzf "$ARCHIVE" htp1-inspector/addon.json | jq -e '.id == "htp1-inspector"'
          (cd "$RUNNER_TEMP/package" && sha256sum -c "$(basename "$ARCHIVE").sha256")
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
      - name: Upload installable test artifact
        uses: actions/upload-artifact@v4
        with:
          name: htp1-addon-htp1-inspector-dev
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
