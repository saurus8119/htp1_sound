
name: Build HTP-1 AirPlay addon

"on":
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile for ARMv7 / Debian 9 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/airplay-out/work"

          docker buildx build --platform linux/arm/v7 --load \
            -t htp1-airplay-build ./addons/airplay/build

          docker run --rm --platform linux/arm/v7 \
            --entrypoint /bin/sh \
            -v "$RUNNER_TEMP/airplay-out:/out" \
            -v "$RUNNER_TEMP/airplay-out/work:/work" \
            htp1-airplay-build \
            -c 'exec /usr/local/bin/build-target'

      - name: Package and verify addon
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist "$RUNNER_TEMP/airplay-diagnostics"

          BUILD_OUTPUT="$RUNNER_TEMP/airplay-out" \
            bash tools/pack.sh airplay

          VERSION="$(jq -r '.version' addons/airplay/addon.json)"
          ARCHIVE="htp1-addon-airplay-${VERSION}.tar.gz"

          test -s "dist/$ARCHIVE"

          # Regenerate the checksum using the archive's relative filename.
          (
            cd dist
            sha256sum "$ARCHIVE" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          if [ -f "$RUNNER_TEMP/airplay-out/BUILD-REPORT.txt" ]; then
            cp "$RUNNER_TEMP/airplay-out/BUILD-REPORT.txt" \
              "$RUNNER_TEMP/airplay-diagnostics/"
          fi

          for pattern in \
            "$RUNNER_TEMP/airplay-out/"*-report.txt \
            "$RUNNER_TEMP/airplay-out/"*-ldd.txt \
            "$RUNNER_TEMP/airplay-out/"*-version.txt \
            "$RUNNER_TEMP/airplay-out/"*-file.txt
          do
            if [ -f "$pattern" ]; then
              cp "$pattern" "$RUNNER_TEMP/airplay-diagnostics/"
            fi
          done

          echo "Package: dist/$ARCHIVE"
          echo "Checksum: dist/SHA256SUMS"
          ls -lh dist/

      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: htp1-airplay-package
          path: |
            dist/htp1-addon-airplay-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: htp1-airplay-diagnostics
          path: ${{ runner.temp }}/airplay-diagnostics/
          if-no-files-found: warn
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: htp1-airplay-package
          path: dist

      - name: Download build diagnostics
        uses: actions/download-artifact@v4
        with:
          name: htp1-airplay-diagnostics
          path: diagnostics

      - name: Verify tag matches addon version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(jq -r '.version' addons/airplay/addon.json)"
          TAG="${GITHUB_REF_NAME}"

          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG must match addon.json version v$VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      - name: Create GitHub release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="dist/htp1-addon-airplay-${VERSION}.tar.gz"

          ASSETS=(
            "$ARCHIVE"
            dist/SHA256SUMS
          )

          if [ -f diagnostics/BUILD-REPORT.txt ]; then
            ASSETS+=(diagnostics/BUILD-REPORT.txt)
          fi

          for pattern in \
            diagnostics/*-report.txt \
            diagnostics/*-ldd.txt \
            diagnostics/*-version.txt \
            diagnostics/*-file.txt
          do
            if [ -f "$pattern" ]; then
              ASSETS+=("$pattern")
            fi
          done

          gh release create "$GITHUB_REF_NAME" \
            "${ASSETS[@]}" \
            --title "HTP-1 AirPlay ${VERSION}" \
            --notes "Automated ARMv7 build. Build diagnostics are attached when available. CI does not establish compatibility on physical HTP-1 hardware."

      - name: Update catalog on main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          tools/index.sh "$GITHUB_REF_NAME"
          cp index.json "$RUNNER_TEMP/index.json.generated"

          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/index.json.generated" index.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.json

          if ! git diff --cached --quiet; then
            git commit -m "Publish AirPlay addon ${VERSION} in catalog"
            git push origin main
          fi
