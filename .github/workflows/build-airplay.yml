
name: Build HTP-1 AirPlay addon

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile for ARMv7 / Debian 9 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/airplay-out/work"
          docker buildx build --platform linux/arm/v7 --load \
            -t htp1-airplay-build ./addons/airplay/build
          docker run --rm --platform linux/arm/v7 \
            --entrypoint /bin/sh \
            -v "$RUNNER_TEMP/airplay-out:/out" \
            -v "$RUNNER_TEMP/airplay-out/work:/work" \
            htp1-airplay-build \
            -c 'exec /usr/local/bin/build-target'

      - name: Assemble and validate addon archive
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(jq -r '.version' addons/airplay/addon.json)"
          STAGE="$RUNNER_TEMP/package-stage"
          DIAGNOSTICS="$RUNNER_TEMP/airplay-diagnostics"

          mkdir -p \
            "$STAGE/airplay/bin" \
            "$STAGE/airplay/lib" \
            "$DIAGNOSTICS" \
            dist

          cp addons/airplay/addon.json "$STAGE/airplay/"
          cp -a addons/airplay/etc addons/airplay/units "$STAGE/airplay/"
          cp addons/airplay/bin/start addons/airplay/bin/volume

          install -m 0755 \
            "$RUNNER_TEMP/airplay-out/shairport-sync" \
            "$STAGE/airplay/bin/shairport-sync"

          install -m 0755 \
            "$RUNNER_TEMP/airplay-out/nqptp" \
            "$STAGE/airplay/bin/nqptp"

          cp -a "$RUNNER_TEMP/airplay-out/lib/." "$STAGE/airplay/lib/"

          chmod 0755 \
            "$STAGE/airplay/bin/start" \
            "$STAGE/airplay/bin/volume"

          # Keep diagnostics separate from the installable addon.
          cp "$RUNNER_TEMP/airplay-out/BUILD-REPORT.txt" "$DIAGNOSTICS/"

          find "$RUNNER_TEMP/airplay-out" -maxdepth 1 -type f \
            \( -name '*-report.txt' \
            -o -name '*-ldd.txt' \
            -o -name '*-version.txt' \
            -o -name '*-file.txt' \) \
            -exec cp {} "$DIAGNOSTICS/" \;

          ARCHIVE="dist/htp1-addon-airplay-${VERSION}.tar.gz"
          CHECKSUM="${ARCHIVE}.sha256"

          tar -czf "$ARCHIVE" -C "$STAGE" airplay

          ARCHIVE_LIST="$RUNNER_TEMP/airplay-archive-list.txt"
          tar -tzf "$ARCHIVE" > "$ARCHIVE_LIST"

          grep -Fxq 'airplay/addon.json' "$ARCHIVE_LIST"
          grep -Fxq 'airplay/bin/shairport-sync' "$ARCHIVE_LIST"
          grep -Fxq 'airplay/bin/nqptp' "$ARCHIVE_LIST"
          grep -Fxq 'airplay/units/airplay.service' "$ARCHIVE_LIST"
          grep -Fxq 'airplay/units/nqptp.service' "$ARCHIVE_LIST"

          if grep -q '/build/' "$ARCHIVE_LIST"; then
            echo "Archive contains an unexpected build path" >&2
            exit 1
          fi

          # Store a checksum that works alongside the downloaded archive.
          (
            cd dist
            sha256sum "$(basename "$ARCHIVE")" \
              > "$(basename "$CHECKSUM")"
          )

          # Verify checksum and package layout before uploading.
          (
            cd dist
            sha256sum --check "$(basename "$CHECKSUM")"
          )

          echo "Installable addon: $ARCHIVE"
          echo "Checksum file: $CHECKSUM"
          ls -l "$ARCHIVE" "$CHECKSUM"

      # The package artifact contains ONLY the installable archive
      # and its matching checksum file.
      - name: Upload installable addon
        uses: actions/upload-artifact@v4
        with:
          name: htp1-airplay-package
          path: |
            dist/htp1-addon-airplay-*.tar.gz
            dist/htp1-addon-airplay-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      # Diagnostic reports are available separately.
      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: htp1-airplay-diagnostics
          path: ${{ runner.temp }}/airplay-diagnostics/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download installable addon
        uses: actions/download-artifact@v4
        with:
          name: htp1-airplay-package
          path: dist

      - name: Verify tag matches addon version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(jq -r '.version' addons/airplay/addon.json)"
          TAG="${GITHUB_REF_NAME}"

          test "$TAG" = "v$VERSION" || {
            echo "Tag $TAG must match addon.json version v$VERSION" >&2
            exit 1
          }

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release package and checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          ARCHIVE="htp1-addon-airplay-${VERSION}.tar.gz"
          CHECKSUM="${ARCHIVE}.sha256"

          test -f "dist/$ARCHIVE"
          test -f "dist/$CHECKSUM"

          (
            cd dist
            sha256sum --check "$CHECKSUM"
          )

          # Ensure the release artifact contains the expected top-level folder.
          tar -tzf "dist/$ARCHIVE" | grep -Fxq 'airplay/addon.json'

          # Reject unexpected extra files in the package artifact.
          find dist -maxdepth 1 -type f \
            ! -name "$ARCHIVE" \
            ! -name "$CHECKSUM" \
            -print -quit | grep -q . && {
              echo "Unexpected files found in release package artifact" >&2
              exit 1
            } || true

      - name: Create GitHub release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="dist/htp1-addon-airplay-${VERSION}.tar.gz"
          CHECKSUM="${ARCHIVE}.sha256"

          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE" \
            "$CHECKSUM" \
            --title "HTP-1 AirPlay ${VERSION}" \
            --notes "Automated ARMv7 build. Download the .tar.gz addon asset and its matching .tar.gz.sha256 checksum. Build diagnostics are published separately as a GitHub Actions artifact. CI does not establish compatibility on physical HTP-1 hardware."

      - name: Update catalog on main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="dist/htp1-addon-airplay-${VERSION}.tar.gz"
          SHA="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$ARCHIVE")"

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/htp1-addon-airplay-${VERSION}.tar.gz"
          UPDATED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          git fetch origin main
          git checkout -B main origin/main

          jq \
            --arg updated "$UPDATED" \
            --arg id "airplay" \
            --arg version "$VERSION" \
            --arg url "$URL" \
            --arg sha256 "$SHA" \
            --argjson size "$SIZE" \
            --arg label "AirPlay" \
            --arg summary "AirPlay receiver built from Shairport Sync and NQPTP" \
            '.name = "htp1-sound" |
             .updated = $updated |
             .addons = ([.addons[]? | select(.id != $id)] +
             [{
               id: $id,
               version: $version,
               label: $label,
               summary: $summary,
               requires: {capabilities: ["source/1"]},
               url: $url,
               sha256: $sha256,
               size: $size
             }])' \
            index.json > index.json.tmp

          mv index.json.tmp index.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.json

          if ! git diff --cached --quiet; then
            git commit -m "Publish AirPlay addon ${VERSION} in catalog"
            git push origin main
          fi
