name: Build HTP-1 AirPlay addon

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile for ARMv7 / Debian 9 baseline
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/airplay-out"
          mkdir -p "$OUT/work"
          docker buildx build --platform linux/arm/v7 --load \
            -t htp1-airplay-build ./addons/airplay/build
          docker run --rm --platform linux/arm/v7 --entrypoint /bin/sh \
            -v "$OUT:/out" -v "$OUT/work:/work" htp1-airplay-build \
            -c 'exec /usr/local/bin/build-target'

      - name: Stage binaries into canonical addon tree
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/airplay-out"
          install -d addons/airplay/bin addons/airplay/lib dist
          install -m 0755 "$OUT/shairport-sync" addons/airplay/bin/shairport-sync
          install -m 0755 "$OUT/nqptp" addons/airplay/bin/nqptp
          cp -a "$OUT/lib/." addons/airplay/lib/
          cp "$OUT/BUILD-REPORT.txt" dist/
          for report in "$OUT"/*-report.txt "$OUT"/*-ldd.txt "$OUT"/*-version.txt; do
            [ ! -f "$report" ] || cp "$report" dist/
          done

      - name: Package and validate with the repository packer
        run: tools/pack.sh

      - name: Validate archive metadata and runtime files
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="dist/htp1-addon-airplay-$(jq -r '.version' addons/airplay/addon.json).tar.gz"
          tar -tzf "$ARCHIVE" > "$RUNNER_TEMP/archive-list.txt"
          test "$(grep -Ec '^airplay/' "$RUNNER_TEMP/archive-list.txt")" -gt 0
          if grep -Eq '(^/|(^|/)\.\.(/|$)|(^|/)build(/|$))' "$RUNNER_TEMP/archive-list.txt"; then
            echo "Archive contains an unsafe or development-only path" >&2
            exit 1
          fi
          jq -e '.id == "airplay" and .units["airplay.service"] == "link" and .units["nqptp.service"] == "link"' \
            < <(tar -xOzf "$ARCHIVE" airplay/addon.json) >/dev/null
          sha256sum -c dist/SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: htp1-airplay-package
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: htp1-airplay-package
          path: dist

      - name: Verify tag matches addon version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' addons/airplay/addon.json)"
          TAG="$GITHUB_REF_NAME"
          test "$TAG" = "v$VERSION" || { echo "Tag $TAG must match addon.json version v$VERSION" >&2; exit 1; }
          ARCHIVE="dist/htp1-addon-airplay-${VERSION}.tar.gz"
          test -s "$ARCHIVE"
          sha256sum -c dist/SHA256SUMS
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/htp1-addon-airplay-${{ steps.version.outputs.version }}.tar.gz" \
            "dist/SHA256SUMS" \
            "dist/BUILD-REPORT.txt" \
            --title "HTP-1 AirPlay ${{ steps.version.outputs.version }}" \
            --notes "Automated ARMv7 build. Review BUILD-REPORT.txt and diagnostic files. CI does not establish compatibility on physical HTP-1 hardware."

      - name: Update catalog on main using shared generator
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p dist
          # The release artifact was built from this tag and is needed to compute
          # the exact checksum/size for the catalog entry.
          rm -f "dist/htp1-addon-airplay-${{ steps.version.outputs.version }}.tar.gz"
          gh release download "$RELEASE_TAG" \
            --pattern "htp1-addon-airplay-*.tar.gz" \
            --dir dist
          tools/index.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish AirPlay addon ${{ steps.version.outputs.version }} in catalog"
            git push origin main
          fi
