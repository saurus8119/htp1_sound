name: Build HTP-1 AirPlay addon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARMv7 binaries in Debian 9 userspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/airplay-out/work"

          docker buildx build \
            --platform linux/arm/v7 \
            --load \
            -t htp1-airplay-build \
            ./addons/airplay/build

          docker run --rm \
            --platform linux/arm/v7 \
            --entrypoint /bin/sh \
            -v "$RUNNER_TEMP/airplay-out:/out" \
            -v "$RUNNER_TEMP/airplay-out/work:/work" \
            htp1-airplay-build \
            -c 'exec /usr/local/bin/build-target'

      - name: Package and verify installable addon
        id: package
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/airplay-out"
          PACKAGE_OUT="$RUNNER_TEMP/release-package"

          VERSION="$(jq -er '.version' addons/airplay/addon.json)"
          ARCHIVE="htp1-addon-airplay-${VERSION}.tar.gz"

          test -s "$OUT/shairport-sync"
          test -s "$OUT/nqptp"
          test -d "$OUT/lib"
          test -d "$OUT/debs"

          install -m 0755 \
            "$OUT/shairport-sync" \
            addons/airplay/bin/shairport-sync

          install -m 0755 \
            "$OUT/nqptp" \
            addons/airplay/bin/nqptp

          rm -rf addons/airplay/lib addons/airplay/debs

          cp -a "$OUT/lib" addons/airplay/lib
          cp -a "$OUT/debs" addons/airplay/debs

          chmod 0755 \
            addons/airplay/bin/* \
            addons/airplay/hooks/*

          mkdir -p "$PACKAGE_OUT"

          bash tools/pack.sh airplay "$PACKAGE_OUT"

          ARCHIVE_PATH="$PACKAGE_OUT/$ARCHIVE"
          CHECKSUM_PATH="$PACKAGE_OUT/$ARCHIVE.sha256"

          test -s "$ARCHIVE_PATH"
          test -s "$CHECKSUM_PATH"

          LIST="$RUNNER_TEMP/airplay-archive-list.txt"
          tar -tzf "$ARCHIVE_PATH" > "$LIST"

          grep -Fxq 'airplay/addon.json' "$LIST"
          grep -Fxq 'airplay/bin/shairport-sync' "$LIST"
          grep -Fxq 'airplay/bin/nqptp' "$LIST"
          grep -Fxq 'airplay/etc/shairport-sync.conf' "$LIST"
          grep -Fxq 'airplay/units/airplay.service' "$LIST"
          grep -Fxq 'airplay/units/nqptp.service' "$LIST"
          grep -Fxq \
            'airplay/units/avahi-daemon.service.d/htp1.conf' \
            "$LIST"

          if grep -Eq \
            '(^|/)(htp1-addon-airplay-[^/]*\.tar\.gz|SHA256SUMS|[^/]+\.tar\.gz\.sha256)$|(^|/)\.\./|^/' \
            "$LIST"; then
            echo "Unexpected nested archive, checksum, or unsafe path." >&2
            exit 1
          fi

          (
            cd "$PACKAGE_OUT"
            sha256sum -c "$ARCHIVE.sha256"
          )

          echo "archive=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Verified installable archive: $ARCHIVE_PATH"
          echo "Verified checksum: $CHECKSUM_
