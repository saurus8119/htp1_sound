name: Build HTP-1 AirPlay addon

"on":
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile for ARMv7 / Debian 9 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/airplay-out/work"
          docker buildx build --platform linux/arm/v7 --load \
            -t htp1-airplay-build ./addons/airplay/build
          docker run --rm --platform linux/arm/v7 \
            --entrypoint /bin/sh \
            -v "$RUNNER_TEMP/airplay-out:/out" \
            -v "$RUNNER_TEMP/airplay-out/work:/work" \
            htp1-airplay-build \
            -c 'exec /usr/local/bin/build-target'

      - name: Assemble and validate addon archive
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(jq -r '.version' addons/airplay/addon.json)"
          STAGE="$RUNNER_TEMP/package-stage"
          DIAGNOSTICS="$RUNNER_TEMP/airplay-diagnostics"

          mkdir -p "$STAGE/airplay/bin" "$STAGE/airplay/lib"
          mkdir -p "$DIAGNOSTICS" dist

          cp addons/airplay/addon.json "$STAGE/airplay/"
          cp -a addons/airplay/etc addons/airplay/units "$STAGE/airplay/"
          cp addons/airplay/bin/start addons/airplay/bin/volume \
            "$STAGE/airplay/bin/"

          install -m 0755 \
            "$RUNNER_TEMP/airplay-out/shairport-sync" \
            "$STAGE/airplay/bin/shairport-sync"
          install -m 0755 \
            "$RUNNER_TEMP/airplay-out/nqptp" \
            "$STAGE/airplay/bin/nqptp"

          cp -a "$RUNNER_TEMP/airplay-out/lib/." "$STAGE/airplay/lib/"
          chmod 0755 "$STAGE/airplay/bin/start" "$STAGE/airplay/bin/volume"

          cp "$RUNNER_TEMP/airplay-out/BUILD-REPORT.txt" "$DIAGNOSTICS/"
          cp "$RUNNER_TEMP/airplay-out/"*-report.txt "$DIAGNOSTICS/" \
            2>/dev/null || true
          cp "$RUNNER_TEMP/airplay-out/"*-ldd.txt "$DIAGNOSTICS/" \
            2>/dev/null || true
          cp "$RUNNER_TEMP/airplay-out/"*-version.txt "$DIAGNOSTICS/" \
            2>/dev/null || true

          ARCHIVE="dist/htp1-addon-airplay-${VERSION}.tar.gz"
          CHECKSUM="${ARCHIVE}.sha256"

          tar -czf "$ARCHIVE" -C "$STAGE" airplay

          ARCHIVE_LIST="$RUNNER_TEMP/airplay-archive-list.txt"
          tar -tzf "$ARCHIVE" > "$ARCHIVE_LIST"

          grep -Fxq 'airplay/addon.json' "$ARCHIVE_LIST"
          grep -Fxq 'airplay/bin/shairport-sync' "$ARCHIVE_LIST"
          grep -Fxq 'airplay/bin/nqptp' "$ARCHIVE_LIST"
          grep -Fxq 'airplay/units/airplay.service' "$ARCHIVE_LIST"
          grep -Fxq 'airplay/units/nqptp.service' "$ARCHIVE_LIST"

          if grep -q '/build/' "$ARCHIVE_LIST"; then
            echo "Archive contains an unexpected build path" >&2
            exit 1
          fi

          (
            cd dist
            sha256sum "$(basename "$ARCHIVE")" \
              > "$(basename "$CHECKSUM")"
            sha256sum -c "$(basename "$CHECKSUM")"
          )

          echo "Built package: $ARCHIVE"
          echo "Checksum: $CHECKSUM"

      - name: Upload installable package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: htp1-airplay-package
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics separately
        uses: actions/upload-artifact@v4
        with:
          name: htp1-airplay-diagnostics
          path: ${{ runner.temp }}/airplay-diagnostics/
          if-no-files-found: warn
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: htp1-airplay-package
          path: dist

      - name: Verify tag matches addon version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(jq -r '.version' addons/airplay/addon.json)"
          TAG="${GITHUB_REF_NAME}"

          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG must match addon.json version v$VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c \
            "htp1-addon-airplay-${{ steps.version.outputs.version }}.tar.gz.sha256"

      - name: Create GitHub release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          gh release create "$GITHUB_REF_NAME" \
            "dist/htp1-addon-airplay-${VERSION}.tar.gz" \
            "dist/htp1-addon-airplay-${VERSION}.tar.gz.sha256" \
            --title "HTP-1 AirPlay ${VERSION}" \
            --notes "Automated ARMv7 build. Build diagnostics are available in the GitHub Actions artifacts. CI does not establish compatibility on physical HTP-1 hardware."

      - name: Update catalog on main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="dist/htp1-addon-airplay-${VERSION}.tar.gz"
          SHA="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$ARCHIVE")"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/htp1-addon-airplay-${VERSION}.tar.gz"
          UPDATED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          git fetch origin main
          git checkout -B main origin/main

          jq --arg updated "$UPDATED" \
             --arg id "airplay" \
             --arg version "$VERSION" \
             --arg url "$URL" \
             --arg sha256 "$SHA" \
             --argjson size "$SIZE" \
             --arg label "AirPlay" \
             --arg summary "AirPlay receiver built from Shairport Sync and NQPTP" \
             '.name = "htp1-sound" |
              .updated = $updated |
              .addons = (
                [.addons[]? | select(.id != $id)] +
                [{
                  id: $id,
                  version: $version,
                  label: $label,
                  summary: $summary,
                  requires: {capabilities: ["source/1"]},
                  url: $url,
                  sha256: $sha256,
                  size: $size
                }]
              )' \
             index.json > index.json.tmp

          mv index.json.tmp index.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish AirPlay addon ${VERSION} in catalog"
            git push origin main
          fi
```
