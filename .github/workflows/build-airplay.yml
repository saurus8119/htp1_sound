
name: Build HTP-1 AirPlay 2.0 addon

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARMv7 binaries in Debian 9 userspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/airplay-out/work"

          docker buildx build \
            --platform linux/arm/v7 \
            --load \
            -t htp1-airplay-build \
            ./addons/airplay/build

          docker run --rm \
            --platform linux/arm/v7 \
            --entrypoint /bin/sh \
            -v "$RUNNER_TEMP/airplay-out:/out" \
            -v "$RUNNER_TEMP/airplay-out/work:/work" \
            htp1-airplay-build \
            -c 'exec /usr/local/bin/build-target'

      - name: Package and verify installable addon
        id: package
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/airplay-out"
          PACKAGE_OUT="$RUNNER_TEMP/release-package"

          VERSION="$(jq -er '.version' addons/airplay/addon.json)"
          ADDON_ID="$(jq -er '.id' addons/airplay/addon.json)"
          EXPECTED_ID="airplay2"

          if [ "$ADDON_ID" != "$EXPECTED_ID" ]; then
            echo "Expected manifest ID '$EXPECTED_ID', got '$ADDON_ID'." >&2
            exit 1
          fi

          ARCHIVE="htp1-addon-${ADDON_ID}-${VERSION}.tar.gz"

          test -s "$OUT/shairport-sync"
          test -s "$OUT/nqptp"
          test -d "$OUT/lib"
          test -d "$OUT/debs"

          install -m 0755 \
            "$OUT/shairport-sync" \
            addons/airplay/bin/shairport-sync
          install -m 0755 \
            "$OUT/nqptp" \
            addons/airplay/bin/nqptp

          rm -rf addons/airplay/lib addons/airplay/debs
          cp -a "$OUT/lib" addons/airplay/lib
          cp -a "$OUT/debs" addons/airplay/debs

          chmod 0755 \
            addons/airplay/bin/* \
            addons/airplay/hooks/*

          mkdir -p "$PACKAGE_OUT"

          # Source folder stays addons/airplay; package identity is airplay2.
          bash tools/pack.sh addons/airplay "$ADDON_ID" "$PACKAGE_OUT"

          ARCHIVE_PATH="$PACKAGE_OUT/$ARCHIVE"
          CHECKSUM_PATH="$PACKAGE_OUT/$ARCHIVE.sha256"

          test -s "$ARCHIVE_PATH"
          test -s "$CHECKSUM_PATH"

          LIST="$RUNNER_TEMP/airplay-archive-list.txt"
          tar -tzf "$ARCHIVE_PATH" > "$LIST"

          grep -Fxq 'airplay2/addon.json' "$LIST"
          grep -Fxq 'airplay2/bin/shairport-sync' "$LIST"
          grep -Fxq 'airplay2/bin/nqptp' "$LIST"
          grep -Fxq 'airplay2/etc/shairport-sync.conf' "$LIST"
          grep -Fxq 'airplay2/units/airplay2.service' "$LIST"
          grep -Fxq 'airplay2/units/nqptp-airplay2.service' "$LIST"
          grep -Fxq 'airplay2/units/avahi-daemon.service.d/htp1.conf' "$LIST"

          # Confirm the archived manifest has the same ID and version.
          tar -xOzf "$ARCHIVE_PATH" airplay2/addon.json |
            jq -e --arg id "$ADDON_ID" --arg version "$VERSION" \
              '.id == $id and .version == $version' >/dev/null

          # Reject unsafe paths and nested release artifacts without
          # mistakenly rejecting the valid "airplay2" package name.
          if grep -Eq \
            '(^|/)\.\.(/|$)|^/|(^|/)(htp1-addon-[^/]*\.tar\.gz|SHA256SUMS|[^/]+\.tar\.gz\.sha256)$' \
            "$LIST"; then
            echo "Unexpected nested archive, checksum, or unsafe path." >&2
            exit 1
          fi

          (
            cd "$PACKAGE_OUT"
            sha256sum -c "$ARCHIVE.sha256"
          )

          echo "archive=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "addon_id=$ADDON_ID" >> "$GITHUB_OUTPUT"

          echo "Verified installable archive: $ARCHIVE_PATH"
          echo "Verified checksum: $CHECKSUM_PATH"

      - name: Verify release tag matches addon version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.package.outputs.version }}"
          EXPECTED_TAG="v${VERSION}"

          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $GITHUB_REF_NAME must match $EXPECTED_TAG" >&2
            exit 1
          fi

      - name: Publish installable archive as GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.package.outputs.version }}"
          ARCHIVE="${{ steps.package.outputs.archive }}"
          CHECKSUM="${{ steps.package.outputs.checksum }}"
          ADDON_ID="${{ steps.package.outputs.addon_id }}"
          NOTES="Installable HTP-1 AirPlay 2.0 addon (ID: ${ADDON_ID}). The tarball contains the addon folder and runtime files. The SHA256 checksum is provided as a separate release asset."

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading assets."
            gh release upload "$GITHUB_REF_NAME" \
              "$ARCHIVE" \
              "$CHECKSUM" \
              --clobber
          else
            echo "Creating release $GITHUB_REF_NAME."
            gh release create "$GITHUB_REF_NAME" \
              "$ARCHIVE" \
              "$CHECKSUM" \
              --title "HTP-1 AirPlay 2.0 ${VERSION}" \
              --notes "$NOTES"
          fi

      - name: Update catalog on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.package.outputs.version }}"
          ADDON_ID="${{ steps.package.outputs.addon_id }}"
          ARCHIVE_NAME="htp1-addon-${ADDON_ID}-${VERSION}.tar.gz"

          mkdir -p "$RUNNER_TEMP/catalog-package"
          cp "${{ steps.package.outputs.archive }}" \
            "$RUNNER_TEMP/catalog-package/$ARCHIVE_NAME"

          git fetch origin main
          git checkout -B main origin/main

          mkdir -p dist
          cp "$RUNNER_TEMP/catalog-package/$ARCHIVE_NAME" dist/

          bash tools/index.sh "$GITHUB_REF_NAME" dist

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.json
          if ! git diff --cached --quiet; then
            git commit \
              -m "Publish AirPlay 2.0 addon ${VERSION} in catalog"
            git push origin main
          fi
