
name: Build AirPlay Add-on

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package AirPlay
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            git \
            jq \
            tar \
            gzip \
            file

      - name: Show repository files
        run: |
          echo "Repository root:"
          pwd
          echo "Packager:"
          ls -l tools/pack.sh
          echo "Add-on files:"
          find addons/airplay -maxdepth 3 -type f -print | sort

      - name: Check shell syntax
        run: |
          bash -n tools/pack.sh

      - name: Validate add-on manifest
        run: |
          jq -e '.id == "airplay" and (.version | type == "string")' \
            addons/airplay/addon.json

      - name: Build AirPlay binaries
        run: |
          echo "Checking for the AirPlay build script..."
          if [ -x tools/build-airplay.sh ]; then
            bash tools/build-airplay.sh
          elif [ -f tools/build-airplay.sh ]; then
            bash tools/build-airplay.sh
          else
            echo "ERROR: tools/build-airplay.sh was not found."
            echo "The workflow needs the repository's actual AirPlay build procedure."
            exit 1
          fi

      - name: Package add-on
        run: |
          set -euo pipefail
          mkdir -p dist
          BUILD_OUTPUT="$RUNNER_TEMP/airplay-out" \
            bash tools/pack.sh airplay
          test -d dist
          find dist -maxdepth 1 -type f -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: htp1-airplay-build
          path: dist/*
          if-no-files-found: error
