
name: Build HTP-1 AirPlay addon

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile for ARMv7 / Debian 9 baseline
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/airplay-out/work"

          docker buildx build \
            --platform linux/arm/v7 \
            --load \
            -t htp1-airplay-build \
            ./addons/airplay/build

          docker run --rm \
            --platform linux/arm/v7 \
            --entrypoint /bin/sh \
            -v "$RUNNER_TEMP/airplay-out:/out" \
            -v "$RUNNER_TEMP/airplay-out/work:/work" \
            htp1-airplay-build \
            -c 'exec /usr/local/bin/build-target'

      - name: Package and verify installable addon
        id: package
        shell: bash
        run: |
          set -euo pipefail

          BUILD_OUTPUT="$RUNNER_TEMP/airplay-out" \
            tools/pack.sh airplay

          VERSION="$(jq -er '.version' addons/airplay/addon.json)"
          ARCHIVE="htp1-addon-airplay-${VERSION}.tar.gz"

          test -s "dist/$ARCHIVE"

          # The archive must contain the add-on, not another project archive.
          tar -tzf "dist/$ARCHIVE" > "$RUNNER_TEMP/archive-list.txt"

          grep -Fxq "airplay/addon.json" \
            "$RUNNER_TEMP/archive-list.txt"

          if grep -Eq \
            '(^|/)(htp1-addon-airplay-[^/]*\.tar\.gz|SHA256SUMS)$' \
            "$RUNNER_TEMP/archive-list.txt"; then
            echo "Nested archive or checksum found inside the addon." >&2
            exit 1
          fi

          # Generate and verify the checksum separately from the archive.
          (
            cd dist
            sha256sum "$ARCHIVE" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          echo "archive=dist/$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Verified installable archive: dist/$ARCHIVE"
          cat dist/SHA256SUMS

      - name: Verify release tag matches addon version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="v${{ steps.package.outputs.version }}"

          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "Tag $GITHUB_REF_NAME does not match $EXPECTED" >&2
            exit 1
          fi

      - name: Publish installable addon archive
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Upload the actual add-on archive, not an Actions artifact wrapper.
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            --title "HTP-1 AirPlay ${{ steps.package.outputs.version }}" \
            --notes "Installable HTP-1 AirPlay addon archive. The catalog contains the archive checksum."

      - name: Update catalog on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # Generate the catalog entry from the verified release archive.
          tools/index.sh "$GITHUB_REF_NAME"
          cp index.json "$RUNNER_TEMP/index.json.generated"

          # Update main without moving or rewriting the release tag.
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/index.json.generated" index.json

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.json

          if ! git diff --cached --quiet; then
            git commit -m "Publish AirPlay addon ${VERSION} in catalog"
            git push origin main
          fi
