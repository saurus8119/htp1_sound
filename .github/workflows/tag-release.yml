name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, without the v"
        required: true
        default: "0.1.2"

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify version, create tag, and start release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          MANIFEST_VERSION="$(jq -r '.version' addons/airplay/addon.json)"

          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Requested version $VERSION does not match addon.json version $MANIFEST_VERSION"
            exit 1
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists."
          fi

          gh workflow run build-airplay.yml --ref "$TAG"
