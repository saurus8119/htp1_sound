name: Build HTPlex ARMv7

on:
  push:
    branches: [main]
    paths:
      - addons/caldera/build/**
      - addons/caldera/bin/caldera-music.bin
      - addons/caldera/lib/**
  workflow_dispatch:

permissions:
  contents: write

# Runtime rebuilds and config-only packaging share one release lane.
# Do not cancel a release halfway through publication.
concurrency:
  group: htpl-ex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release metadata before the expensive build
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -er '.version' addons/caldera/addon.json)"
          ADDON_ID="$(jq -er '.id' addons/caldera/addon.json)"
          NOTES="docs/RELEASE-NOTES-$VERSION.md"
          test "$ADDON_ID" = "caldera"
          test -s "$NOTES"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "Full ARMv7 runtime rebuild requested for HTPlex $VERSION."

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARMv7 installer environment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/caldera-out"
          docker buildx build \
            --platform linux/arm/v7 \
            --load \
            -t htp1-caldera-armv7-build \
            ./addons/caldera/build

      - name: Run official Caldera installer under ARMv7 emulation
        run: |
          set -euo pipefail
          docker run --rm \
            --platform linux/arm/v7 \
            -v "$RUNNER_TEMP/caldera-out:/out" \
            htp1-caldera-armv7-build

      - name: Assemble installable HTP-1 add-on
        id: package
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/caldera-stage"
          mkdir -p "$STAGE" dist addons/caldera/bin addons/caldera/lib
          tar -xzf "$RUNNER_TEMP/caldera-out/caldera-music-armv7.tar.gz" -C "$STAGE"
          cp "$STAGE/caldera-music/bin/caldera-music" addons/caldera/bin/caldera-music.bin
          rm -rf addons/caldera/lib
          mkdir -p addons/caldera/lib
          for lib in \
            ld-linux-armhf.so.3 ld-2.31.so \
            libavformat.so.62 libavcodec.so.62 libavutil.so.60 \
            libswresample.so.6 \
            libpthread.so.0 libpthread-2.31.so \
            libdl.so.2 libdl-2.31.so \
            librt.so.1 librt-2.31.so \
            libz.so.1 libz.so.1.2.11 \
            libstdc++.so.6 libstdc++.so.6.0.28 \
            libm.so.6 libm-2.31.so \
            libgcc_s.so.1 \
            libnss_dns.so.2 libnss_dns-2.31.so \
            libnss_files.so.2 libnss_files-2.31.so \
            libresolv.so.2 libresolv-2.31.so \
            libc.so.6 libc-2.31.so; do
            test -e "$STAGE/caldera-music/lib/$lib"
            cp -a "$STAGE/caldera-music/lib/$lib" addons/caldera/lib/
          done
          chmod 0755 addons/caldera/bin/caldera-music.bin
          test -x addons/caldera/lib/ld-linux-armhf.so.3
          test -e addons/caldera/lib/libc.so.6
          test -e addons/caldera/lib/libm.so.6
          test -e addons/caldera/lib/libpthread.so.0
          test -e addons/caldera/lib/libstdc++.so.6
          bash tools/pack.sh caldera dist
          VERSION="$(jq -er '.version' addons/caldera/addon.json)"
          ARCHIVE="dist/htp1-addon-caldera-$VERSION.tar.gz"
          CHECKSUM="$ARCHIVE.sha256"
          test -s "$ARCHIVE"
          test -s "$CHECKSUM"
          (cd dist && sha256sum -c "$(basename "$CHECKSUM")")
          tar -tzf "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          rm -f addons/caldera/bin/caldera-music.bin
          rm -rf addons/caldera/lib

      - name: Upload installable add-on and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: caldera-music-armv7-addon
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
            ${{ runner.temp }}/caldera-out/launcher-file.txt
            ${{ runner.temp }}/caldera-out/binary-elf-header.txt
            ${{ runner.temp }}/caldera-out/binary-ldd.txt
            ${{ runner.temp }}/caldera-out/launcher-help.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Caldera GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -er '.version' addons/caldera/addon.json)"
          ADDON_ID="$(jq -er '.id' addons/caldera/addon.json)"
          TAG="v${VERSION}"
          ARCHIVE="${{ steps.package.outputs.archive }}"
          CHECKSUM="${{ steps.package.outputs.checksum }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "HTPlex $VERSION" \
              --notes-file "docs/RELEASE-NOTES-$VERSION.md"
          else
            gh release edit "$TAG" \
              --title "HTPlex $VERSION" \
              --notes-file "docs/RELEASE-NOTES-$VERSION.md"
          fi
          gh release upload "$TAG" "$ARCHIVE" "$CHECKSUM" --clobber

      - name: Verify published HTPlex release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -er '.version' addons/caldera/addon.json)"
          TAG="v$VERSION"
          ARCHIVE_NAME="htp1-addon-caldera-$VERSION.tar.gz"
          CHECKSUM_NAME="$ARCHIVE_NAME.sha256"
          gh release view "$TAG" --json isDraft,isPrerelease,assets |
            jq -e --arg archive "$ARCHIVE_NAME" --arg checksum "$CHECKSUM_NAME" '
              .isDraft == false and .isPrerelease == false and
              ([.assets[].name] | index($archive) != null) and
              ([.assets[].name] | index($checksum) != null)
            ' >/dev/null
          mkdir -p "$RUNNER_TEMP/published-release"
          gh release download "$TAG" \
            --pattern "$ARCHIVE_NAME" \
            --pattern "$CHECKSUM_NAME" \
            --dir "$RUNNER_TEMP/published-release"
          (cd "$RUNNER_TEMP/published-release" && sha256sum -c "$CHECKSUM_NAME")

      - name: Publish Caldera in the HTP-1 add-on catalog
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -er '.version' addons/caldera/addon.json)"
          ADDON_ID="$(jq -er '.id' addons/caldera/addon.json)"
          LABEL="$(jq -er '.label' addons/caldera/addon.json)"
          SUMMARY="$(jq -er '.summary' addons/caldera/addon.json)"
          REQUIRES="$(jq -c '.requires // {}' addons/caldera/addon.json)"
          TAG="v${VERSION}"
          ARCHIVE_NAME="htp1-addon-${ADDON_ID}-${VERSION}.tar.gz"
          ARCHIVE="${{ steps.package.outputs.archive }}"
          CHECKSUM="${{ steps.package.outputs.checksum }}"
          SHA256="$(awk '{print $1}' "$CHECKSUM")"
          SIZE="$(stat -c%s "$ARCHIVE")"
          URL="https://github.com/saurus8119/htp1_sound/releases/download/$TAG/$ARCHIVE_NAME"

          git fetch origin main
          git checkout -B main origin/main
          jq \
            --arg id "$ADDON_ID" \
            --arg version "$VERSION" \
            --arg label "$LABEL" \
            --arg summary "$SUMMARY" \
            --arg url "$URL" \
            --arg sha256 "$SHA256" \
            --argjson size "$SIZE" \
            --argjson requires "$REQUIRES" \
            '.addons = ((.addons // []) | map(select(.id != $id)) + [{
              id: $id,
              version: $version,
              label: $label,
              summary: $summary,
              requires: $requires,
              url: $url,
              sha256: $sha256,
              size: $size
            }])' index.json > index.json.tmp
          mv index.json.tmp index.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "Catalog already contains the exact release URL, checksum, and size."
          else
            git commit -m "Publish HTPlex $VERSION in add-on catalog"
            git push origin main
          fi

          git fetch origin main
          git show origin/main:index.json |
            jq -e --arg version "$VERSION" --arg url "$URL" --arg sha256 "$SHA256" --argjson size "$SIZE" '
              any(.addons[]; .id == "caldera" and .version == $version and
                  .url == $url and .sha256 == $sha256 and .size == $size)
            ' >/dev/null
          echo "GitHub release assets and catalog entry verified for HTPlex $VERSION."
