// HTP-1 Shairport Sync 5.6.x configuration.
// Output goes to the firmware's default ALSA/I2S device.
general =
{
  name = "HTP-1 AirPlay";
  output_backend = "alsa";
  volume_range_db = 60;
  run_this_when_volume_is_set = "/var/lib/olympia/addons/airplay/bin/volume ";
};

alsa =
{
  output_device = "default";
  audio_backend_buffer_desired_length_in_seconds = 0.15;
};

sessioncontrol =
{
  run_this_before_play_begins = "/var/lib/olympia/addons/airplay/bin/start";
  wait_for_completion = "yes";
  allow_session_interruption = "yes";
};

metadata =
{
  enabled = "no";
};
