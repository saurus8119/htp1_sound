// Independent HTP-1 AirPlay receiver configuration.
general = {
  name = "HTP-1";
  output_backend = "alsa";
  ignore_volume_control = "yes";
  run_this_when_volume_is_set = "/var/lib/olympia/addons/airplay2/bin/airplay-volume.sh";
};

sessioncontrol = {
  run_this_before_play_begins = "/opt/olympia/addon-source start airplay2";
  wait_for_completion = "yes";
};

alsa = {
  output_device = "default:I2S";
  disable_standby_mode = "never";
  period_size = 2048;
  buffer_size = 16384;
  use_mmap_if_available = "yes";
};

use_precision_timing = "no";

audio_backend_buffer_desired_length = 48000;
audio_decoded_buffer_desired_length_in_seconds = 2.0;

diagnostics = {
  log_verbosity = 0;
};
