// No-op update to run the corrected config-only release workflow.
// Independent HTP-1 AirPlay receiver configuration..

general = {
  name = "HTP-1";
  output_backend = "alsa";
  interpolation = "soxr";
  // alac_decoder = "ffmpeg";
  drift_tolerance_in_seconds = 0.002;
  // resync_threshold_in_seconds = 0.0;
  ignore_volume_control = "yes";
  run_this_when_volume_is_set = "/var/lib/olympia/addons/airplay2/bin/airplay-volume.sh";
};

sessioncontrol = {
  run_this_before_play_begins = "/opt/olympia/addon-source start airplay";
  wait_for_completion = "yes";
};

alsa = {
  output_device = "hw:I2S,0";       // Force direct hardware access
  disable_standby_mode = "never";
  use_precision_timing = "yes";   // Rely on precise hardware timing
  disable_synchronization = "no"; // Let Shairport Sync lock the clocks
  period_size = 1024;
  buffer_size = 16384;
};

diagnostics = {
  log_verbosity = 0;
};
