<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTP-1 System Monitor</title>
<style>
:root{color-scheme:dark;font:14px/1.5 system-ui;background:#151719;color:#eee}body{max-width:1100px;margin:auto;padding:20px}header,.toolbar,.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 12px}section,.panel{background:#202427;border:1px solid #383e42;border-radius:9px;padding:15px;margin:12px 0}.muted{color:#aab0b4}.status{margin-left:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.metric{background:#171b1e;border:1px solid #343b40;border-radius:7px;padding:12px}.metric strong{display:block;font-size:22px;margin-top:5px}.metric small{color:#aab0b4}button,a.button{background:#30383e;color:#fff;border:1px solid #59636a;border-radius:5px;padding:8px 12px;text-decoration:none;cursor:pointer}pre{background:#090b0c;padding:12px;white-space:pre-wrap}.good{color:#8bd49a}.bad{color:#ff9999}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid #3b4246}progress{width:100%;height:10px}
</style></head><body><header><h1>HTP-1 System Monitor</h1><span id="connection" class="muted status">Connecting…</span></header>
<p class="muted">Read-only hardware and operating-system status. Refreshes every 5 seconds. No audio settings or services are changed.</p>
<section><div class="toolbar"><h2>System overview</h2><span class="muted status" id="sampled">—</span></div><div class="grid" id="metrics"></div></section>
<section><h2>Storage</h2><div id="disks"></div></section><section><h2>Network interfaces</h2><div id="network"></div></section><section><h2>Temperatures</h2><div id="temps" class="muted">No exposed thermal sensors found.</div></section>
<script>
(function(){var api='http://'+location.hostname+':17822',$=function(x){return document.getElementById(x);};
function esc(s){return String(s===null||s===undefined?'—':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function bytes(n){if(n===null||n===undefined)return '—';var u=['B','KB','MB','GB','TB'],i=0;while(n>=1024&&i<4){n/=1024;i++;}return n.toFixed(i?1:0)+' '+u[i];}
function metric(a,b,c){return '<div class="metric"><small>'+esc(a)+'</small><strong>'+esc(b)+'</strong><small>'+esc(c||'')+'</small></div>';}
function duration(s){if(s===null)return '—';return Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h '+Math.floor(s%3600/60)+'m';}
function refresh(){fetch(api+'/api/system',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json();}).then(function(d){
$('sampled').textContent='Sampled '+d.sampled_at;
$('metrics').innerHTML=metric('CPU usage',d.cpu_percent===null?'Warming up':d.cpu_percent+'%','Load '+(d.load_average||[]).join(' / '))+metric('Hostname',d.hostname,'Kernel '+d.kernel)+metric('Uptime',duration(d.uptime_seconds),'Since boot')+metric('Memory',d.memory.percent===null?'—':d.memory.percent+'%',bytes(d.memory.used)+' of '+bytes(d.memory.total))+metric('Swap',bytes(d.swap.total-d.swap.free),bytes(d.swap.total)+' total');
$('disks').innerHTML=d.disks.map(function(x){return '<div class="panel"><div class="inline"><b>'+esc(x.path)+'</b><span class="status">'+esc(x.percent)+'%</span></div><progress max="100" value="'+esc(x.percent)+'"></progress><small class="muted">'+bytes(x.used)+' used / '+bytes(x.total)+' total; '+bytes(x.free)+' free</small></div>';}).join('')||'Unavailable';
$('network').innerHTML='<table><thead><tr><th>Interface</th><th>Received</th><th>RX errors</th><th>Transmitted</th><th>TX errors</th></tr></thead><tbody>'+d.network.map(function(n){return '<tr><td>'+esc(n.interface)+'</td><td>'+bytes(n.rx_bytes)+'</td><td>'+esc(n.rx_errors)+'</td><td>'+bytes(n.tx_bytes)+'</td><td>'+esc(n.tx_errors)+'</td></tr>';}).join('')+'</tbody></table>';
$('temps').innerHTML=d.temperatures.length?d.temperatures.map(function(t){return '<span class="metric">'+esc(t.sensor)+': <b>'+esc(t.celsius)+' °C</b></span>';}).join(' '):'No exposed thermal sensors found.';
$('connection').textContent='Connected';$('connection').className='good status';
}).catch(function(e){$('connection').textContent='API unavailable: '+e.message;$('connection').className='bad status';});}
refresh();setInterval(refresh,5000);})();
</script></body></html>
