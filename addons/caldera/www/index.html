<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTPlex — Plex sign-in</title>
<style>
:root{color-scheme:dark;font:15px/1.55 system-ui,sans-serif;background:#151719;color:#e8e8e8}
body{margin:0;padding:28px 22px;max-width:760px;margin-inline:auto}
h1{font-size:24px;margin:0 0 8px}
p{margin:10px 0}
.panel{background:#202428;border:1px solid #3b4248;border-radius:8px;padding:18px;margin:18px 0}
a{color:#9bc8ff}
#status{color:#bbb}
#pin{font-size:30px;font-weight:700;letter-spacing:.12em;margin:12px 0}
#pin[hidden]{display:none}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#090b0c;border:1px solid #333;border-radius:6px;padding:14px;min-height:70px}
button{background:#30363b;color:#fff;border:1px solid #555;border-radius:5px;padding:8px 12px;cursor:pointer}
</style>
</head>
<body>
<h1>HTPlex</h1>
<p>Link HTPlex to your Plex account.</p>
<section class="panel">
  <p><strong>1.</strong> Open <a href="https://plex.tv/link" target="_blank" rel="noopener noreferrer">plex.tv/link</a> on your phone or computer.</p>
  <p><strong>2.</strong> Enter the PIN shown below.</p>
  <p><strong>3.</strong> Approve the sign-in with Plex. This page updates automatically.</p>
  <div id="pin" hidden></div>
  <p id="status" aria-live="polite">Waiting for HTPlex's sign-in PIN…</p>
</section>
<h2>HTPlex sign-in output</h2>
<pre id="output">Waiting for HTPlex to start Plex sign-in…</pre>
<button id="refresh" type="button">Refresh</button>
<script>
(() => {
  const output = document.getElementById('output');
  const status = document.getElementById('status');
  const pin = document.getElementById('pin');
  let busy = false;
  async function refresh() {
    if (busy) return;
    busy = true;
    try {
      const response = await fetch('./auth.txt?t=' + Date.now(), {cache:'no-store'});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const content = await response.text();
      output.textContent = content;
      if (/Plex authorization is saved/i.test(content)) {
        pin.hidden = true;
        status.textContent = 'Plex is already authorized.';
      } else {
        const match = content.match(/Enter code:\s*([A-Z0-9-]+)/i);
        if (match) {
          pin.textContent = match[1];
          pin.hidden = false;
          status.textContent = 'Enter this PIN at plex.tv/link.';
        } else {
          pin.hidden = true;
          status.textContent = 'Waiting for HTPlex to provide the Plex PIN…';
        }
      }
    } catch (error) {
      status.textContent = 'Unable to read Caldera sign-in status.';
      output.textContent = 'Could not load the local sign-in status. ' + error.message;
    } finally {
      busy = false;
    }
  }
  document.getElementById('refresh').addEventListener('click', refresh);
  refresh();
  window.setInterval(refresh, 3000);
})();
</script>
</body>
</html>
